name: Go

on:
  push:
    branches: [ main ]
  pull_request: {}

permissions:
  contents: read

jobs:
  go:
    uses: Icinga/github-actions/.github/workflows/go.yml@main

  static-daemon:
    name: Test Static Linux Daemon
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Test
        run: go test -v ./internal/daemon
