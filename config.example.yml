# This is the configuration file for Icinga for Kubernetes.

# Connection configuration for the database to which Icinga for Kubernetes synchronizes data.
# This is also the database used in Icinga for Kubernetes Web to view and work with the data.
database:
  # Database type. Only 'mysql' is supported yet which is the default.
#  type: mysql

  # Database host or absolute Unix socket path.
  host: localhost

  # Database port. By default, the MySQL port.
#  port:

  # Database name.
  database: kubernetes

  # Database user.
  user: kubernetes

  # Database password.
  password: CHANGEME

# Logging configuration.
logging:
  # Default logging level. One of 'fatal', 'error', 'warn', 'info' or 'debug'.
#  level: info

  # Logging output. Either 'console' (stderr) or 'systemd-journald'.
  # By default, systemd-journald when running under systemd, otherwise stderr.
#  output:

  # Interval for periodic logging as a duration string.
#  interval: 20s

  # Log levels for individual components, overriding 'level'.
#  options:
#    database: debug

  # Verbosity of the Kubernetes client libraries, from 0 to 9.
  # Overridden by the -v/--v command line flag.
#  kubernetes: 0

# Namespaces to synchronize. At most one of 'include' and 'exclude' may be set.
# By default, all namespaces are synchronized.
# Cluster-scoped resources, i.e. nodes and persistent volumes, are always synchronized.
namespaces:
  # Synchronize only these namespaces.
#  include:
#    - production
#    - staging

  # Synchronize all namespaces except these.
#  exclude:
#    - testing

# Configuration for Prometheus metrics API.
prometheus:
  # Prometheus server URL.
#  url: http://localhost:9090

# Configuration for Icinga Notifications daemon.
notifications:
  # URL to the API root. Different URI schemes are possible.
  # - http: Unencrypted HTTP connection. Requires username and password/password_file to be set.
  #   For example: http://example.com:5680
  # - https: HTTPS connection. Either username and password/password_file or cert and key are required.
  #   For example: https://example.com:5680
  # - unix: HTTP connection over a Unix Domain Socket. Authentication is based on the operating system user.
  #   For example: unix:///path/to/socket
#  url:

  # Base URL of the Icinga Web 2 setup. It is used to build the absolute object URLs transmitted with each event,
  # which Icinga Notifications passes on to the notified contacts. This must be an absolute URL. If left empty,
  # events are submitted without an object URL.
#  icingaweb2_url: https://example.com/icingaweb2

  # Username to authenticate against the Icinga Notifications API.
#  username:

  # Password for the defined user.
#  password:
#  password_file: /run/secrets/notifications_password

  # TLS configuration for https URLs. The ca is used to verify the server cert, while cert and key are the client certificate.
#  ca: /path/to/ca
#  cert: /path/to/client.crt
#  key: /path/to/client.key
